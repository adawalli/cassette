name: Release and Publish

# This file is named publish.yml because npm's trusted publisher config pins the workflow
# filename. Renaming it breaks the OIDC claim and every publish fails until the setting on
# npmjs.com is updated to match.
#
# release-please runs here rather than in its own workflow on purpose: a GitHub Release
# created with GITHUB_TOKEN does not trigger other workflows, so a separate `on: release`
# publish job would never fire. Running both in one workflow removes the need for a PAT.

on:
  push:
    branches: [main]

# Two pushes to main in quick succession would otherwise race on the Release PR, and with
# publish in the same workflow, on npm itself. Never cancel in progress: a cancelled run
# mid-`npm publish` is worse than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          release-type: node

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - run: npm install -g npm@latest

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - run: bun run install:deps --frozen-lockfile

      # --ignore-scripts below skips prepublishOnly, so these are the only gates that run.
      - run: bun run typecheck

      - run: bun test --coverage

      - run: bun run build

      - name: Publish to npm
        run: npm publish --access public --provenance --ignore-scripts
