name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun run install:deps --frozen-lockfile
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: bun x --package renovate@44.133.0 renovate-config-validator --strict --no-global renovate.json
      - run: bun scripts/check-dependency-policy.mjs

      - run: bun run typecheck

      - run: bun test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
