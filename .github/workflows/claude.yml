name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # The prompt below is a PR code review, so every trigger has to resolve to a PR number.
    # issue_comment fires for plain issues too - github.event.issue.pull_request is the only
    # thing distinguishing the two.
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: write # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the reviewer can diff against the base branch

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - run: bun install

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          track_progress: true
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # issue_comment and issues payloads carry `issue`, not `pull_request` - without the
          # fallback the prompt resolves to ".../pull/" with no number.
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number || github.event.issue.number }}"
          show_full_output: true
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(bun test:*),Bash(bun run typecheck:*),Bash(bun run build:*),Bash(bunx tsc:*)"
